  <rect x="506" y="670" width="568" height="14" fill="#1c2a37" stroke="#2b4356" stroke-width="2"/>
  <rect x="546" y="684" width="488" height="12" fill="#16222e" stroke="#2b4356" stroke-width="1.5"/>
