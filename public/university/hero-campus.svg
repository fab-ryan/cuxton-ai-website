  <circle cx="1170" cy="418" r="26" fill="#101b26" stroke="#f5a623" stroke-width="2"/>
  <path d="M1170 418v-15M1170 418l11 8" stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
  <g stroke="#2f88a8" stroke-width="1.5" fill="none" opacity="0.85">
