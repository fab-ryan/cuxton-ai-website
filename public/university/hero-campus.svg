  <rect y="700" width="1600" height="200" fill="#0c141d"/>
  <path d="M0 700h1600" stroke="#2b4356" stroke-width="2"/>
  <path d="M640 900 740 700h100L700 900Z" fill="#101b26" stroke="#2b4356" stroke-width="1.5"/>
  <g stroke="#1a3d4d" stroke-width="1" opacity="0.8">
