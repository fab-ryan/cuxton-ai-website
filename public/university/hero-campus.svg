    <rect x="466" y="540" width="30" height="48"/><rect x="512" y="540" width="24" height="48"/>
    <rect x="374" y="614" width="30" height="48"/><rect x="420" y="614" width="30" height="48"/>
    <rect x="466" y="614" width="30" height="48"/><rect x="512" y="614" width="24" height="48"/>
  </g>
  <rect x="420" y="540" width="30" height="48" fill="#f5a623" opacity="0.9"/>

  <!-- main hall: pediment, colonnade, steps -->
  <path d="M790 300 1074 404H506Z" fill="#16222e" stroke="#2b4356" stroke-width="2"/>
  <path d="M790 336 976 404H604Z" fill="none" stroke="#2f88a8" stroke-width="1.5"/>
  <rect x="506" y="404" width="568" height="26" fill="#1c2a37" stroke="#2b4356" stroke-width="2"/>
  <g fill="#16222e" stroke="#2b4356" stroke-width="2">
    <rect x="530" y="430" width="30" height="240"/><rect x="606" y="430" width="30" height="240"/>
    <rect x="682" y="430" width="30" height="240"/><rect x="758" y="430" width="30" height="240"/>
    <rect x="834" y="430" width="30" height="240"/><rect x="910" y="430" width="30" height="240"/>
    <rect x="986" y="430" width="30" height="240"/>
